[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "collaborative_scraper"
version = "1.0.0"
description = "Server to coordinate distributed webcrawling"
requires-python = ">=3.10"
authors = [
  { name="Edoardo"}
]
dependencies = [
"Flask",
"flask-cors",
"lxml",
"platformdirs",
]

[project.scripts]
collaborative_scraper = "collaborative_scraper.server:main"